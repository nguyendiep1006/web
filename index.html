<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Website</title>
    <link rel="stylesheet" href="assets\style.css">
    <!-- logo cf -->
    <link rel="icon" type="image/png" href="assets/images/logo.png">

    <!-- link bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>
    <header>
        <div class="section-content">
            <nav class="navbar fixed-top" style="background: var(--primary-color);">
                <div class="container-fluid">
                    <a href="index.html" class="navbar-brand">
                        <img src="assets/images/logo.png" style="width: 80px; height: auto;" alt="Logo Coffee">
                    </a>

                    <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas"
                        data-bs-target="#offcanvasNavbarCustom" aria-controls="offcanvasNavbarCustom"
                        aria-label="Toggle navigation" style="border-color: var(--secondary-color);">
                        <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
                    </button>

                    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbarCustom"
                        aria-labelledby="offcanvasNavbarCustomLabel" style="background-color: var(--primary-color);">

                        <div class="offcanvas-header">
                            <h5 class="offcanvas-title" id="offcanvasNavbarCustomLabel"
                                style="color: var(--secondary-color);">MENU</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"
                                style="filter: invert(1);"></button>
                        </div>

                        <div class="offcanvas-body">
                            <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                                <li class="nav-item">
                                    <a class="nav-link" href="index.html" style="color: var(--white-color);">Home</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="#" style="color: var(--white-color);">About us</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="Menu.html" style="color: var(--white-color);">Menu</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="#" style="color: var(--white-color);">Gallery</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="Contact.html" style="color: var(--white-color);">Contact us</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero-section" style="padding-top: 80px;">
            <div class="section-content">
                <div class="hero-details">
                    <h2 class="title">Best Coffee</h2>
                    <h3 class="subtitle">Allow our coffee to light up your day!</h3>
                    <p class="descriptions">Enter the realm of unparalleled brew,
                        crafted for the soul of a true coffee lover. Welcome.</p>

                    <div class="buttons">
                        <a href="Menu.html" class="button order-now">Order Now</a>
                        <a href="Contact.html" class="button contact-us">Contact Us</a>
                    </div>
                </div>
                <div class="hero-image-wrapper">
                    <img src="./coffee-hero-section.png" alt="Hero" class="hero-image">
                </div>
            </div>
        </section>
    </main>
    <!-- bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
